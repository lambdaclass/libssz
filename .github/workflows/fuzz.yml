name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    if: github.event_name != 'schedule'
    name: smoke / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_arbitrary
          - roundtrip
          - diff_encode
          - diff_hash_tree_root
          - hash_tree_root_fuzz
          - merkle_primitives
          - union_decode
          - diff_decode
          - variable_container
          - nested_types
          - diff_htr_container
          - union_htr
          - transparent
          - all_variable
          - wide_union
          - deep_nesting
          - many_fields
          - offset_adversarial
          - construction_api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: nightly

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-deps-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-deps-

      - run: cargo install cargo-fuzz --locked

      - name: Run fuzz target (60s)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
        working-directory: fuzz

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

  fuzz-nightly:
    if: github.event_name == 'schedule'
    name: nightly / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_arbitrary
          - roundtrip
          - diff_encode
          - diff_hash_tree_root
          - hash_tree_root_fuzz
          - merkle_primitives
          - union_decode
          - diff_decode
          - variable_container
          - nested_types
          - diff_htr_container
          - union_htr
          - transparent
          - all_variable
          - wide_union
          - deep_nesting
          - many_fields
          - offset_adversarial
          - construction_api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: nightly

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-deps-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-deps-

      - run: cargo install cargo-fuzz --locked

      - name: Restore corpus cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzz target (3h)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=10800
        working-directory: fuzz

      - name: Save corpus cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
