name: Property tests

# The default-budget property tests already run in CI as part of `make test`.
# This workflow runs the long search nightly, and on demand with a chosen budget.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      budget_ms:
        description: "Time budget per property, in milliseconds (the job stops after 60 minutes, about 14 rounds of properties)"
        default: "30000"

env:
  CARGO_TERM_COLOR: always

jobs:
  property-long:
    name: Property tests (long)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cargo.lock is not committed, so there is nothing to hash: save a
          # new cache every run and restore the latest one.
          key: property-${{ github.run_id }}
          restore-keys: property-
      - name: Run property tests
        env:
          PROPERTY_BUDGET_MS: ${{ inputs.budget_ms || '30000' }}
          EPHYRA_REPORT_JSON: ${{ github.workspace }}/property-tests/.ephyra/reports.jsonl
        run: make property-tests-long PROPERTY_BUDGET_MS="$PROPERTY_BUDGET_MS"
      - name: Upload ephyra artifacts
        # A run that hits the timeout is cancelled, not failed, and its
        # failures are worth keeping too.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ephyra-${{ github.run_id }}
          path: property-tests/.ephyra/
