name: Benchmarks

on:
  pull_request:
    types: [labeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  bench-regression:
    name: Benchmark Regression Check
    if: github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-
      - name: Benchmark PR branch
        run: cargo bench --workspace --bench encode --bench decode --bench hash_tree_root --bench merkle --bench differential -- --save-baseline pr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: false
      - name: Benchmark base branch
        run: cargo bench --workspace --bench encode --bench decode --bench hash_tree_root --bench merkle --bench differential -- --save-baseline base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false
      - name: Install critcmp
        run: cargo install critcmp
      - name: Compare benchmarks
        run: critcmp base pr
