name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  actionlint:
    name: GHA Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cargo.lock is not committed, so resolve it here: the key then changes
      # when a dependency or the compiler does, and the build uses this lock.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            clippy-${{ steps.lock.outputs.rustc }}-
            clippy-
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --exclude spec-tests -- -D warnings

  build:
    name: Build
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Resolve Cargo.lock for the cache key; see the clippy job.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-${{ steps.lock.outputs.rustc }}-
            build-
      - run: cargo build --workspace --all-targets --exclude spec-tests

  test:
    name: Test (${{ matrix.features }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: default
            args: ""
          - features: alloc-only
            args: "--no-default-features --features alloc"
    steps:
      - uses: actions/checkout@v7
      # Resolve Cargo.lock for the cache key; see the clippy job.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-${{ steps.lock.outputs.rustc }}-
            build-
      - run: cargo test --workspace --exclude spec-tests ${{ matrix.args }}

  doc:
    name: Doc
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Resolve Cargo.lock for the cache key; see the clippy job.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: doc-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            doc-${{ steps.lock.outputs.rustc }}-
            doc-
      - run: cargo doc --workspace --no-deps --exclude spec-tests
        env:
          RUSTDOCFLAGS: "-D warnings"

  no-std-check:
    name: no_std Check
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add thumbv7m-none-eabi riscv64imac-unknown-none-elf
      # Resolve Cargo.lock for the cache key; see the clippy job.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: no-std-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            no-std-${{ steps.lock.outputs.rustc }}-
            no-std-
      - run: cargo check -p libssz -p libssz-types -p libssz-merkle --target thumbv7m-none-eabi --no-default-features --features alloc
      - run: cargo check -p libssz -p libssz-types -p libssz-merkle --target riscv64imac-unknown-none-elf --no-default-features --features alloc

  iai-bench:
    name: iai-callgrind
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Resolve Cargo.lock for the cache key; see the clippy job.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: iai-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            iai-${{ steps.lock.outputs.rustc }}-
            iai-
      - run: sudo apt-get install -y valgrind
      - run: cargo install iai-callgrind-runner --version 0.14.2
      - run: cargo bench --workspace --bench iai_merkle --bench iai_encode_decode

  coverage:
    name: Coverage
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Resolve Cargo.lock for the cache key; see the clippy job.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Only the dependency sources are cached, not `target`: cargo-llvm-cov reports on
      # every instrumented test binary it finds there, so binaries left over from other
      # branches would be counted as uncovered code.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: coverage-deps-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            coverage-deps-${{ steps.lock.outputs.rustc }}-
            coverage-deps-
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude spec-tests --lcov --output-path lcov.info --fail-under-lines 70
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  spec-tests:
    name: Spec Tests
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Resolve Cargo.lock for the cache key; see the clippy job.
      - id: lock
        run: |
          cargo generate-lockfile
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: spec-tests-build-${{ steps.lock.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            spec-tests-build-${{ steps.lock.outputs.rustc }}-
            spec-tests-build-
      - uses: actions/cache@v6
        with:
          path: target/spec-tests
          key: consensus-spec-vectors-v1.7.0-alpha.13
      - run: ./spec-tests/download-vectors.sh
      - run: cargo test -p spec-tests
