on:
  release:
    types: [published]

jobs:
  crates-publish:
    runs-on: ubuntu-latest
    environment: crates-release-prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          override: true

      - name: Publish libssz
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          OUTPUT=$(cargo publish --package libssz 2>&1) || {
            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "libssz already published, continuing"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }

      - name: Wait for crates.io indexing
        run: sleep 30

      - name: Publish libssz-merkle
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          OUTPUT=$(cargo publish --package libssz-merkle 2>&1) || {
            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "libssz-merkle already published, continuing"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }

      - name: Wait for crates.io indexing
        run: sleep 30

      - name: Publish libssz-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          OUTPUT=$(cargo publish --package libssz-types 2>&1) || {
            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "libssz-types already published, continuing"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }

      - name: Wait for crates.io indexing
        run: sleep 30

      - name: Publish libssz-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          OUTPUT=$(cargo publish --package libssz-derive 2>&1) || {
            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "libssz-derive already published, continuing"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
