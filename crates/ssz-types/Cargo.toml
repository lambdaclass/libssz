[package]
name = "libssz-types"
version = "0.3.0"
edition = "2021"
description = "Bounded SSZ collection types: Vector, List, Bitvector, Bitlist"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lambdaclass/libssz"
readme = "../../README.md"
keywords = ["ssz", "ethereum", "serialization", "merkle", "no-std"]
categories = ["encoding", "cryptography::cryptocurrencies"]

[features]
default = ["std"]
std = ["alloc", "libssz/std", "libssz-merkle/std"]
alloc = ["libssz/alloc", "libssz-merkle/alloc"]

[dependencies]
libssz = { version = "0.3.0", path = "../ssz", default-features = false }
libssz-merkle = { version = "0.3.0", path = "../ssz-merkle", default-features = false }
smallvec = { version = "1.13", default-features = false }
