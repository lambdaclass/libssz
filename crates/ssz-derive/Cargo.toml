[package]
name = "libssz-derive"
version = "0.2.1"
edition = "2021"
description = "Derive macros for SSZ encoding, decoding, and HashTreeRoot"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lambdaclass/libssz"
readme = "../../README.md"
keywords = ["ssz", "ethereum", "serialization", "merkle", "no-std"]
categories = ["encoding", "cryptography::cryptocurrencies"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
libssz = { version = "0.2.1", path = "../ssz" }
libssz-merkle = { version = "0.2.1", path = "../ssz-merkle" }
