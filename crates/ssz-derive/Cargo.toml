[package]
name = "ssz-derive"
version = "0.1.0"
edition = "2021"
description = "Derive macros for SSZ encoding, decoding, and HashTreeRoot"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
ssz = { path = "../ssz" }
ssz-merkle = { path = "../ssz-merkle" }
