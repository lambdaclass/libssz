[package]
name = "ssz-bench"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
ssz = { path = "../crates/ssz" }
ssz-types = { path = "../crates/ssz-types" }
ssz-merkle = { path = "../crates/ssz-merkle" }
ssz-derive = { path = "../crates/ssz-derive" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
iai-callgrind = "0.14"
lighthouse_ssz = { package = "ethereum_ssz", version = "0.10" }
lighthouse_ssz_derive = { package = "ethereum_ssz_derive", version = "0.10" }
lighthouse_ssz_types = { package = "ssz_types", version = "0.14" }
tree_hash = "0.12"
tree_hash_derive = "0.12"
ssz_rs = "0.9"
typenum = "1"

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "hash_tree_root"
harness = false

[[bench]]
name = "merkle"
harness = false

[[bench]]
name = "iai_merkle"
harness = false

[[bench]]
name = "iai_encode_decode"
harness = false

[[bench]]
name = "differential"
harness = false
