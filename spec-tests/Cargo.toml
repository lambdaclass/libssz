[package]
name = "spec-tests"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
ssz = { path = "../crates/ssz" }
ssz-types = { path = "../crates/ssz-types" }
ssz-merkle = { path = "../crates/ssz-merkle" }
ssz-derive = { path = "../crates/ssz-derive" }

# Test vector loading (vectors downloaded by spec-tests/download-vectors.sh)
snap = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
hex = "0.4"

[dev-dependencies]
paste = "1"
