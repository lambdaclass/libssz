[package]
name = "spec-tests"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
libssz = { version = "0.1.0", path = "../crates/ssz" }
libssz-types = { version = "0.1.0", path = "../crates/ssz-types" }
libssz-merkle = { version = "0.1.0", path = "../crates/ssz-merkle" }
libssz-derive = { version = "0.1.0", path = "../crates/ssz-derive" }

# Test vector loading (vectors downloaded by spec-tests/download-vectors.sh)
snap = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
hex = "0.4"
