[package]
name = "ssz-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Our library (renamed to avoid collision with ethereum_ssz which also exports as "ssz")
libssz = { version = "0.2.0", path = "../crates/ssz" }
libssz_types = { package = "libssz-types", version = "0.2.0", path = "../crates/ssz-types" }
libssz_merkle = { package = "libssz-merkle", version = "0.2.0", path = "../crates/ssz-merkle" }
libssz_derive = { package = "libssz-derive", version = "0.2.0", path = "../crates/ssz-derive" }

# Lighthouse reference (encode/decode + hash tree root)
# ethereum_ssz's lib name is "ssz", so we alias to avoid collision with our crate
lighthouse_ssz = { package = "ethereum_ssz", version = "0.10" }
tree_hash = "0.12"

ssz_rs = "0.9"

[workspace]
members = ["."]

[[bin]]
name = "decode_arbitrary"
path = "fuzz_targets/decode_arbitrary.rs"
doc = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
doc = false

[[bin]]
name = "diff_encode"
path = "fuzz_targets/diff_encode.rs"
doc = false

[[bin]]
name = "diff_hash_tree_root"
path = "fuzz_targets/diff_hash_tree_root.rs"
doc = false

